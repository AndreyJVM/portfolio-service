name: Pull Request CI

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Run Platform Tests
        run: go test -v -race ./...

      - name: Set up Go for QR Service
        uses: actions/setup-go@v7
        with:
          go-version-file: 'qr-service/go.mod'
          cache-dependency-path: qr-service/go.sum

      - name: Run QR Service Tests
        run: cd qr-service && go test -v ./...
