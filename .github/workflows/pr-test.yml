name: Pull Request CI

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Run Tests & Style Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Verify Code Style (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l cmd/ internal/ qr-service/*.go)
          if [ -n "$UNFORMATTED" ]; then
            echo "❌ The following files are not formatted with gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "✅ All Go files conform to gofmt standards."

      - name: Run go vet
        run: |
          go vet ./...
          (cd qr-service && go vet ./...)

      - name: Run Platform Tests
        run: go test -v -race ./...

      - name: Set up Go for QR Service
        uses: actions/setup-go@v7
        with:
          go-version-file: 'qr-service/go.mod'
          cache-dependency-path: qr-service/go.sum

      - name: Run QR Service Tests
        run: cd qr-service && go test -v -race ./...
