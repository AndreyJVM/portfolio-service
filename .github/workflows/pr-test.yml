name: Pull Request CI

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Run Tests & Style Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Verify Code Style (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l cmd/ internal/)
          if [ -n "$UNFORMATTED" ]; then
            echo "❌ The following files are not formatted with gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "✅ All Go files conform to gofmt standards."

      - name: Run go vet
        run: go vet ./...

      - name: Run Platform Tests
        run: go test -v -race ./...

  container-security:
    name: Container Security & Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Scan Dockerfile Misconfigurations (Trivy IaC)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'Dockerfile'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Build local container image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: devops-platform:pr-check

      - name: Scan image with Trivy (Security Gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'devops-platform:pr-check'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
