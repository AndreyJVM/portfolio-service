name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DOCKER_IMAGE_NAME: andreyvorobevaqa/portfolio-service
  QR_SERVICE_IMAGE_NAME: andreyvorobevaqa/qr-service

jobs:
  detect-changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
      qr: ${{ steps.filter.outputs.qr }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Paths Filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'cmd/**'
              - 'internal/**'
              - 'web/**'
              - 'content/**'
              - 'go.mod'
              - 'go.sum'
              - 'vendor/**'
              - 'Dockerfile'
              - '.dockerignore'
            qr:
              - 'qr-service/**'
            deploy:
              - 'docker-compose.yml'
              - 'nginx/**'
              - 'scripts/**'

  build-and-push-app:
    name: Build & Push Go DevOps Platform
    needs: detect-changes
    if: needs.detect-changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Verify Code Style (gofmt & go vet)
        run: |
          UNFORMATTED=$(gofmt -l cmd/ internal/)
          if [ -n "$UNFORMATTED" ]; then
            echo "❌ The following files are not formatted with gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi
          go vet ./...

      - name: Run Go tests
        run: go test -v ./...

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push DevOps Platform Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan DevOps Platform image with Trivy (Security Gate)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: '${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  build-and-push-qr:
    name: Build & Push QR Service
    needs: detect-changes
    if: needs.detect-changes.outputs.qr == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'qr-service/go.mod'
          cache-dependency-path: qr-service/go.sum

      - name: Verify Code Style (gofmt & go vet)
        run: |
          UNFORMATTED=$(gofmt -l qr-service/*.go)
          if [ -n "$UNFORMATTED" ]; then
            echo "❌ The following files are not formatted with gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi
          cd qr-service && go vet ./...

      - name: Test Go QR Service
        run: cd qr-service && go test -v ./...

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push QR Service Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./qr-service
          push: true
          tags: |
            ${{ env.QR_SERVICE_IMAGE_NAME }}:latest
            ${{ env.QR_SERVICE_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan QR Service image with Trivy (Security Gate)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: '${{ env.QR_SERVICE_IMAGE_NAME }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  deploy-to-vds:
    name: Zero-Downtime Deploy to VDS
    needs: [detect-changes, build-and-push-app, build-and-push-qr]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.detect-changes.outputs.app == 'true' ||
       needs.detect-changes.outputs.qr == 'true' ||
       needs.detect-changes.outputs.deploy == 'true' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy deployment files to VDS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          source: "docker-compose.yml,nginx/,scripts/"
          target: "/home/${{ secrets.VDS_USER }}/apps/my-app/"

      - name: Run Zero-Downtime Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          script: |
            cd /home/${{ secrets.VDS_USER }}/apps/my-app/
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh
