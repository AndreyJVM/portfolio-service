name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DOCKER_IMAGE_NAME: andreyvorobevaqa/portfolio-service

jobs:
  detect-changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Paths Filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'cmd/**'
              - 'internal/**'
              - 'web/**'
              - 'content/**'
              - 'go.mod'
              - 'go.sum'
              - 'vendor/**'
              - 'Dockerfile'
              - '.dockerignore'
            deploy:
              - 'docker-compose.yml'
              - 'nginx/**'
              - 'scripts/**'

  build-and-push-app:
    name: Build & Push Go DevOps Platform
    needs: detect-changes
    if: needs.detect-changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Verify Code Style (gofmt & go vet)
        run: |
          UNFORMATTED=$(gofmt -l cmd/ internal/)
          if [ -n "$UNFORMATTED" ]; then
            echo "❌ The following files are not formatted with gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi
          go vet ./...

      - name: Run Go tests
        run: go test -v ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Scan Dockerfile Misconfigurations (Trivy IaC)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'Dockerfile'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Build local container image for security scan
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.DOCKER_IMAGE_NAME }}:local-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan DevOps Platform image with Trivy (Security Gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.DOCKER_IMAGE_NAME }}:local-test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push verified image to Docker Hub
        run: |
          docker tag ${{ env.DOCKER_IMAGE_NAME }}:local-test ${{ env.DOCKER_IMAGE_NAME }}:latest
          docker tag ${{ env.DOCKER_IMAGE_NAME }}:local-test ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.DOCKER_IMAGE_NAME }}:latest
          docker push ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}

  deploy-to-vds:
    name: Zero-Downtime Deploy to VDS
    needs: [detect-changes, build-and-push-app]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.detect-changes.outputs.app == 'true' ||
       needs.detect-changes.outputs.deploy == 'true' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy deployment files to VDS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          source: "docker-compose.yml,nginx/,scripts/"
          target: "/home/${{ secrets.VDS_USER }}/apps/my-app/"

      - name: Run Zero-Downtime Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          script: |
            cd /home/${{ secrets.VDS_USER }}/apps/my-app/
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh
