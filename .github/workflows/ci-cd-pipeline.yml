name: CI/CD Pipeline

on:
  workflow_dispatch:

env:
  DOCKER_IMAGE_NAME: andreyvorobevaqa/portfolio-service
  QR_SERVICE_IMAGE_NAME: andreyvorobevaqa/qr-service
  PDF_SERVICE_IMAGE_NAME: andreyvorobevaqa/pdf-service

jobs:
  # ==========================================
  # JOB 1: Сборка и тестирование (Maven & Go)
  # ==========================================
  build-and-test:
    name: Build & Test (Java & Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: |
            qr-service/go.sum
            pdf-service/go.sum

      - name: Test Go Microservices
        run: |
          echo "Testing qr-service..."
          cd qr-service && go test -v ./... && cd ..
          echo "Testing pdf-service..."
          cd pdf-service && go test -v ./... && cd ..

      - name: Build and run Java tests
        run: mvn clean verify

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

  # ==========================================
  # JOB 2: Сборка Docker и пуш в Docker Hub
  # ==========================================
  docker-build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Java App Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}

      - name: Build and push Go QR Service Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./qr-service
          push: true
          tags: |
            ${{ env.QR_SERVICE_IMAGE_NAME }}:latest
            ${{ env.QR_SERVICE_IMAGE_NAME }}:${{ github.sha }}

      - name: Build and push Go PDF Service Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./pdf-service
          push: true
          tags: |
            ${{ env.PDF_SERVICE_IMAGE_NAME }}:latest
            ${{ env.PDF_SERVICE_IMAGE_NAME }}:${{ github.sha }}

  # ==========================================
  # JOB 3: Zero-Downtime деплой на VDS
  # ==========================================
  deploy-to-vds:
    name: Zero-Downtime Deploy to VDS
    runs-on: ubuntu-latest
    needs: docker-build-and-push
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy compose and nginx to VDS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          source: "docker-compose.yml,nginx/"
          target: "/home/${{ secrets.VDS_USER }}/apps/my-app/"

      - name: Zero-Downtime Blue-Green Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          script: |
            cd /home/${{ secrets.VDS_USER }}/apps/my-app/
            echo "📥 1. Загрузка свежих образов..."
            docker compose pull app qr-service pdf-service

            echo "⚡ 2. Быстрое обновление Go микросервисов..."
            docker compose up -d --no-deps qr-service pdf-service

            echo "🚀 3. Запуск нового экземпляра Java приложения рядом со старым (scale app=2)..."
            # Запоминаем текущий работающий контейнер
            OLD_CONTAINER_ID=$(docker compose ps -q app | head -n 1)

            # Поднимаем 2 контейнера app
            docker compose up -d --no-deps --scale app=2 --no-recreate app

            echo "⏳ 4. Ожидание готовности нового экземпляра (healthcheck)..."
            for i in $(seq 1 30); do
              HEALTHY_COUNT=$(docker compose ps app --format '{{.Health}}' | grep -c "healthy" || true)
              if [ "$HEALTHY_COUNT" -ge 2 ]; then
                echo "✅ Новый контейнер прогрет и полностью здоров!"
                break
              fi
              echo "   ждем готовности... ($i/30)"
              sleep 2
            done

            echo "🔄 5. Перезагрузка Nginx..."
            docker compose up -d --no-deps nginx
            docker compose exec -T nginx nginx -s reload || true

            echo "🧹 6. Остановка старого контейнера..."
            if [ -n "$OLD_CONTAINER_ID" ]; then
              docker stop "$OLD_CONTAINER_ID" || true
              docker rm "$OLD_CONTAINER_ID" || true
            fi

            # Возвращаем scale в 1
            docker compose up -d --no-deps --scale app=1 app

            echo "🗑️ 7. Очистка неиспользуемых слоев Docker..."
            docker image prune -f
            echo "🎉 Zero-downtime деплой успешно завершен!"
