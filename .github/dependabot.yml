# Dependabot configuration for Primary Cloud Lab
# Documentation: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # 1. Зависимости основного сервиса Go (Go modules)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      go-dependencies:
        patterns:
          - "*"

  # 2. Зависимости микросервиса QR (Go modules)
  - package-ecosystem: "gomod"
    directory: "/qr-service"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
      - "qr-service"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      qr-dependencies:
        patterns:
          - "*"

  # 3. Обновление версий GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    groups:
      actions-dependencies:
        patterns:
          - "*"

  # 4. Базовые образы Dockerfile основного сервиса
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "build(deps)"
      include: "scope"

  # 5. Базовые образы Dockerfile микросервиса QR
  - package-ecosystem: "docker"
    directory: "/qr-service"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
      - "qr-service"
    commit-message:
      prefix: "build(deps)"
      include: "scope"
