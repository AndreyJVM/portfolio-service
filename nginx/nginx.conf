# Upstream для Java приложения с fail_timeout и max_fails
upstream portfolio_backend {
    server app:8080 max_fails=3 fail_timeout=5s;
    keepalive 32;
}

# Upstream для Go QR-сервиса
upstream qr_backend {
    server qr-service:8081;
    keepalive 32;
}

# Первый блок: HTTP -> HTTPS
server {
    listen 80;
    server_name vorobevaqa.ru www.vorobevaqa.ru;
    return 301 https://$host$request_uri;
}

# Второй блок: HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name vorobevaqa.ru www.vorobevaqa.ru;

    # === SSL-сертификаты ===
    ssl_certificate /etc/nginx/ssl/public.pem;
    ssl_certificate_key /etc/nginx/ssl/private.pem;

    # === Настройки SSL ===
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # === Gzip сжатие ===
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # === Заголовки безопасности ===
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # === Кастомная страница ошибок Nginx (500, 502, 503, 504) ===
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # === Прокси на QR Code Microservice (Golang) ===
    location /api/qr {
        proxy_pass http://qr_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503;
    }

    # === Прокси на Portfolio Java-приложение (Spring Boot) ===
    location / {
        proxy_pass http://portfolio_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Zero-Downtime настройки: мгновенный переброс на здоровый контейнер
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }
}
