{{define "head_extra"}}
<style>
  .markdown-content pre {
    background: #0f172a;
    color: #f8fafc;
    padding: 1.25rem;
    border-radius: 12px;
    overflow-x: auto;
    font-size: 0.9rem;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .markdown-content code {
    color: var(--bs-primary);
    background: rgba(var(--bs-primary-rgb), 0.1);
    padding: 0.2rem 0.4rem;
    border-radius: 6px;
    font-size: 0.88em;
  }
  .markdown-content pre code {
    color: inherit;
    background: transparent;
    padding: 0;
  }
  .markdown-content h1, .markdown-content h2, .markdown-content h3 {
    font-weight: 700;
    margin-top: 1.75rem;
    margin-bottom: 1rem;
  }
  .markdown-content p {
    line-height: 1.7;
    color: var(--bs-body-color);
  }
  .markdown-content blockquote {
    border-left: 4px solid var(--bs-primary);
    padding-left: 1rem;
    color: var(--bs-secondary-color);
    font-style: italic;
  }
</style>
{{end}}

{{define "content"}}
<div class="container py-4">
  <!-- Хлебные крошки -->
  <nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="/" class="text-decoration-none">Главная</a></li>
      <li class="breadcrumb-item"><a href="/courses" class="text-decoration-none">Курсы</a></li>
      <li class="breadcrumb-item"><a href="/courses/{{.Course.Slug}}" class="text-decoration-none">{{.Course.Title}}</a></li>
      <li class="breadcrumb-item active" aria-current="page">{{.Lesson.Title}}</li>
    </ol>
  </nav>

  <div class="row g-4">
    <!-- Основной контент урока -->
    <div class="col-lg-9 mx-auto">
      <div class="card border rounded-4 p-4 p-md-5 shadow-sm bento-card mb-4">
        <div class="d-flex align-items-center justify-content-between border-bottom pb-3 mb-4">
          <div>
            <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-1 rounded-pill mb-2">
              Урок {{.Lesson.Order}} • {{.Course.Title}}
            </span>
            <h1 class="fw-bold mb-0">{{.Lesson.Title}}</h1>
          </div>
          <span class="badge bg-body-secondary text-body-secondary border px-3 py-2 rounded-pill">
            <i class="far fa-clock me-1"></i>{{.Lesson.Duration}}
          </span>
        </div>

        <div class="markdown-content">
          {{.LessonContentSafe}}
        </div>

        <!-- Навигация между уроками -->
        <div class="d-flex justify-content-between align-items-center pt-4 mt-5 border-top">
          <a href="/courses/{{.Course.Slug}}" class="btn btn-outline-secondary rounded-pill px-4">
            <i class="fas fa-arrow-left me-1"></i> К списку уроков
          </a>
          <button type="button" class="btn btn-success rounded-pill px-4" id="completeLessonBtn">
            <i class="fas fa-check me-1"></i> Урок изучен
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
{{end}}

{{define "scripts_extra"}}
<script>
  document.getElementById('completeLessonBtn')?.addEventListener('click', function() {
    this.classList.remove('btn-success');
    this.classList.add('btn-outline-success');
    this.innerHTML = '<i class="fas fa-check-double me-1"></i> Пройдено!';
    if (window.showToast) {
      window.showToast('Отлично! Прогресс урока сохранен.', 'success');
    }
  });
</script>
{{end}}
