<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar(active)" class="navbar navbar-expand-lg fixed-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            <span class="brand-text">AV</span>
        </a>

        <div class="d-flex align-items-center order-lg-3">
            <!-- Индикатор доступности сервисов (Actuator Health) -->
            <div class="system-status-indicator me-3 d-none d-sm-flex align-items-center"
                 id="systemStatusBadge"
                 tabindex="0"
                 role="button"
                 data-bs-toggle="popover"
                 data-bs-trigger="hover focus"
                 data-bs-placement="bottom"
                 data-bs-html="true"
                 title="<i class='fas fa-server me-1'></i> Статус системы"
                 data-bs-content="Проверка соединения...">
                <span class="status-ping me-2" id="statusPing">
                    <span class="status-ping-circle"></span>
                    <span class="status-ping-ring"></span>
                </span>
                <span class="status-text fw-medium text-body-secondary" id="systemStatusText">Systems Online</span>
            </div>

            <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">
                <i class="fas fa-moon" id="themeIcon"></i>
            </button>

            <button class="navbar-toggler ms-2" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>

        <div class="collapse navbar-collapse order-lg-2" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'home'} ? 'active' : ''" th:href="@{/}">Главная</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'about'} ? 'active' : ''" th:href="@{/about}">Обо мне</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'projects'} ? 'active' : ''" th:href="@{/projects}">Проекты</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'qr'} ? 'active' : ''" th:href="@{/qr}">QR-генератор</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
