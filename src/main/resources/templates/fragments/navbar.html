<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar(active)" class="navbar navbar-expand-lg fixed-top">
    <!-- Полоса прогресса прокрутки страницы -->
    <div id="scrollProgressBar" class="scroll-progress-bar"></div>

    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}" aria-label="Андрей Воробьев - Главная">
            <img th:src="@{/favicon.svg}" alt="Логотип" class="navbar-brand-logo" width="36" height="36">
        </a>

        <div class="d-flex align-items-center order-lg-3">
            <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">
                <i class="fas fa-moon" id="themeIcon"></i>
            </button>

            <button class="navbar-toggler ms-2" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>

        <div class="collapse navbar-collapse order-lg-2" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'home'} ? 'active' : ''" th:href="@{/}">Главная</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'education' or active == 'about'} ? 'active' : ''" th:href="@{/education}">Образование</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'projects'} ? 'active' : ''" th:href="@{/projects}">Проекты</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'qr'} ? 'active' : ''" th:href="@{/qr}">QR-генератор</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
