<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="scripts">
  <!-- Toast Container for global notification toasts -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1090;">
    <div id="liveToast" class="toast align-items-center border-0 shadow-lg rounded-3" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex p-1">
        <div class="toast-body d-flex align-items-center py-2 px-3">
          <i id="toastIcon" class="fas fa-circle-check text-success me-2 fa-lg"></i>
          <span id="toastMessage" class="fw-medium">Уведомление</span>
        </div>
        <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Закрыть"></button>
      </div>
    </div>
  </div>

  <!-- Плавающая кнопка "Наверх" (Back to Top) -->
  <button type="button" id="backToTopBtn" class="btn btn-primary rounded-circle back-to-top shadow" aria-label="Вернуться наверх" title="Наверх">
    <i class="fas fa-chevron-up"></i>
  </button>

  <!-- Bootstrap 5.3 Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Global Application Scripts -->
  <script th:src="@{/js/main.js}" defer></script>
</div>
</body>
</html>
