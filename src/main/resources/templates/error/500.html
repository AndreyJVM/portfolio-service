<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <th:block th:replace="~{fragments/head :: head(
      title='Внутренняя ошибка сервера (500)',
      description='Ошибка при обработке запроса.',
      keywords='error, 500',
      ogTitle='500 | Внутренняя ошибка',
      ogDescription='Произошла непредвиденная ошибка на сервере.',
      ogImage='',
      ogUrl=''
  )}"></th:block>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('')}"></div>

<main class="container py-5 text-center my-auto">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="p-4">
        <div class="display-1 fw-bold text-danger mb-3">
          <i class="fas fa-triangle-exclamation"></i>
        </div>
        <h1 class="h2 fw-bold mb-3">500 — Внутренняя ошибка сервера</h1>
        <p class="text-muted mb-4">
          Произошла непредвиденная ошибка. Мы уже разбираемся с проблемой!
        </p>
        <div class="d-flex justify-content-center gap-3">
          <a th:href="@{/}" class="btn btn-primary px-4">
            <i class="fas fa-house me-2"></i>На главную
          </a>
          <a th:href="@{/qr}" class="btn btn-outline-secondary px-4">
            <i class="fas fa-qrcode me-2"></i>QR-генератор
          </a>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
