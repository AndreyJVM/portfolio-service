<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <th:block th:replace="~{fragments/head :: head(
      title='Страница не найдена (404)',
      description='Запрашиваемая страница не существует.',
      keywords='404, not found',
      ogTitle='404 | Страница не найдена',
      ogDescription='Запрашиваемая страница не найдена.',
      ogImage='',
      ogUrl=''
  )}"></th:block>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('')}"></div>

<main class="container py-5 text-center my-auto">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="p-4">
        <div class="display-1 fw-bold text-primary mb-3">
          <i class="fas fa-compass-drafting"></i>
        </div>
        <h1 class="h2 fw-bold mb-3">404 — Страница не найдена</h1>
        <p class="text-muted mb-4">
          Запрашиваемая страница перемещена или никогда не существовала.
        </p>
        <div class="d-flex justify-content-center gap-3">
          <a th:href="@{/}" class="btn btn-primary px-4">
            <i class="fas fa-house me-2"></i>На главную
          </a>
          <a th:href="@{/projects}" class="btn btn-outline-secondary px-4">
            <i class="fas fa-laptop-code me-2"></i>Проекты
          </a>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
