services:
  # ========== JAVA PORTFOLIO APP ==========
  app:
    image: andreyvorobevaqa/portfolio-service:latest
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_BASE_URL: ${APP_BASE_URL:-https://vorobevaqa.ru}
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Xms128m"
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 15s

  # ========== GO QR-CODE MICROSERVICE ==========
  qr-service:
    image: andreyvorobevaqa/qr-service:latest
    container_name: qr-microservice
    restart: unless-stopped
    environment:
      PORT: "8081"
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - app-network

  # ========== GO PDF GENERATOR MICROSERVICE ==========
  pdf-service:
    image: andreyvorobevaqa/pdf-service:latest
    container_name: pdf-microservice
    restart: unless-stopped
    environment:
      PORT: "8082"
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - app-network

  # ========== NGINX (REVERSE PROXY / API GATEWAY) ==========
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/50x.html:/usr/share/nginx/html/50x.html:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_healthy
      qr-service:
        condition: service_started
      pdf-service:
        condition: service_started
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
