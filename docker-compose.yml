services:
  # ========== DEVOPS PLATFORM (GOLANG BACKEND) ==========
  app:
    image: andreyvorobevaqa/portfolio-service:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-https://vorobevaqa.ru}
      PORT: "8080"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 4
      start_period: 3s

  # ========== GO QR-CODE MICROSERVICE ==========
  qr-service:
    image: andreyvorobevaqa/qr-service:latest
    container_name: qr-microservice
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: "8081"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M
        reservations:
          cpus: "0.05"
          memory: 16M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "/app/qr-service", "healthcheck" ]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 2s

  # ========== NGINX (REVERSE PROXY / API GATEWAY) ==========
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/50x.html:/usr/share/nginx/html/50x.html:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
      qr-service:
        condition: service_healthy
    networks:
      - app-network

  # ========== CERTBOT (AUTO-RENEW SSL) ==========
  certbot:
    image: certbot/certbot:latest
    container_name: certbot-renew
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./ssl:/ssl
    # Проверка обновления каждые 12 часов и копирование свежих сертификатов в ./ssl
    entrypoint: >
      /bin/sh -c 'trap exit TERM; while :; do
        certbot renew --webroot -w /var/www/certbot --deploy-hook "cp -L /etc/letsencrypt/live/vorobevaqa.ru/fullchain.pem /ssl/public.pem && cp -L /etc/letsencrypt/live/vorobevaqa.ru/privkey.pem /ssl/private.pem && chmod 644 /ssl/public.pem && chmod 600 /ssl/private.pem";
        sleep 12h & wait $${!};
      done;'
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
